spring.application.name=planb

spring.profiles.include=secret

# ===== MySQL DataSource: 하나의 DB만 사용 =====
spring.datasource.url=jdbc:mysql://localhost:3306/plan_b?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root1!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBaits =====
mybatis.mapper-locations=classpath:/mappers/*.xml
mybatis.type-aliases-package=com.ssafy.planb
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler

# ===== Security =====
# 운영용 만료시간(30분, 7일)
jwt.access-token-expiry=1800000
jwt.refresh-token-expiry=604800000
